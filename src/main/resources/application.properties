# Conexao com o MongoDB (padrao local). Para usar o Atlas, crie o arquivo
# application-local.properties com a sua string e rode com o perfil "local".
spring.data.mongodb.uri=mongodb://localhost:27017/pizzaria
spring.data.mongodb.database=pizzaria

# Usuario e senha padrao do Spring Security (o login real usa os usuarios do banco)
#spring.main.allow-circular-references=true
spring.security.user.name=user
spring.security.user.password=shalom

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# Dashboard: coloque true UMA vez para gerar 80 pedidos de exemplo (marcados como "demo") e depois volte para false
pediupatrao.dados-demo=false