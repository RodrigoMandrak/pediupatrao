<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
        <div class="btn-group">
            <a href="/auditoria" class="btn btn-outline-secondary btn-sm">Todos</a>
            <a href="/auditoria?entidade=PEDIDO" class="btn btn-outline-secondary btn-sm">Pedidos</a>
            <a href="/auditoria?entidade=CLIENTE" class="btn btn-outline-secondary btn-sm">Clientes</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Data/hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Campo</th>
                        <th>Valor anterior</th>
                        <th>Novo valor</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="8" class="text-center text-muted py-5">Nenhum registro de auditoria.</td>
                    </tr>
                    <tr th:each="r : ${registros}">
                        <td class="ps-3 small" th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td>
                            <span th:text="${r.usuario}"></span>
                            <span class="badge bg-secondary" th:text="${r.perfil}"></span>
                        </td>
                        <td th:text="${r.operacao}"></td>
                        <td class="small">
                            <span th:text="${r.entidade}"></span>
                            <div class="text-muted" th:text="${r.entidadeId}"></div>
                        </td>
                        <td>
                            <div th:each="a : ${r.alteracoes}" th:text="${a.campo}"></div>
                        </td>
                        <td>
                            <div th:each="a : ${r.alteracoes}" th:text="${a.valorAnterior ?: '—'}"></div>
                        </td>
                        <td>
                            <div th:each="a : ${r.alteracoes}" th:text="${a.valorNovo ?: '—'}"></div>
                        </td>
                        <td th:text="${r.justificativa ?: '—'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
