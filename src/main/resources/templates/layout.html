<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <!-- Token CSRF e perfil do usuário, usados pelos scripts das telas -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <meta name="perfil" th:content="${#authentication.authorities[0].authority}">
        <script>
            // Toda chamada fetch que altera dados (POST, PUT, DELETE) leva o token CSRF no cabeçalho
            (function () {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const cabecalho = document.querySelector('meta[name="_csrf_header"]').content;
                const fetchOriginal = window.fetch;
                window.fetch = function (url, opcoes) {
                    opcoes = opcoes || {};
                    const metodo = (opcoes.method || 'GET').toUpperCase();
                    if (metodo !== 'GET' && metodo !== 'HEAD') {
                        opcoes.headers = Object.assign({}, opcoes.headers, {[cabecalho]: token});
                    }
                    return fetchOriginal(url, opcoes);
                };
            })();
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
