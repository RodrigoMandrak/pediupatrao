<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasAnyRole('ATENDENTE','GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger" id="alerta-erro" style="display:none"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Cliente</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>

                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-3" th:text="${nomesClientes[pedido.clienteId] ?: pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade + 'x ' + item.nome}"></div>
                            <!-- pedidos antigos, criados antes dos itens -->
                            <span th:if="${#lists.isEmpty(pedido.itens)}"
                                  th:text="${pedido.quantidade + 'x ' + pedido.sabor}"></span>
                        </td>
                        <td th:text="${pedido.subtotal != null} ? ('R$ ' + ${#numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA')}) : '-'"></td>
                        <td th:text="${pedido.descontoPercentual != null} ? (${pedido.descontoPercentual} + '%') : '-'"></td>
                        <td class="fw-bold" th:text="${pedido.valorTotal != null} ? ('R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}) : '-'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}"></span>
                            <div class="small text-muted" th:if="${pedido.justificativaCancelamento != null}"
                                 th:text="${'Motivo: ' + pedido.justificativaCancelamento}"></div>
                        </td>
                        <td class="small">
                            <span th:if="${pedido.dataEntrada != null}"
                                  th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></span>
                            <div class="text-muted" th:text="${pedido.responsavelEntrada}"></div>
                        </td>
                        <td class="small">
                            <span th:if="${pedido.dataSaida != null}"
                                  th:text="${#temporals.format(pedido.dataSaida, 'dd/MM/yyyy HH:mm')}"></span>
                            <div class="text-muted" th:text="${pedido.responsavelSaida}"></div>
                        </td>
                        <td class="text-end pe-3">
                            <!-- Botões de avanço de status (atendente e gerente) -->
                            <span sec:authorize="hasAnyRole('ATENDENTE','GERENTE')">
                                <button type="button" class="btn btn-sm btn-outline-primary mb-1"
                                        th:each="proximo : ${pedido.proximosStatus}"
                                        th:text="${proximo}"
                                        th:attr="data-id=${pedido.id},data-status=${proximo}"
                                        onclick="mudarStatus(this)"></button>
                            </span>
                            <!-- Desconto e cancelamento: só o gerente -->
                            <span sec:authorize="hasRole('GERENTE')" th:if="${pedido.cancelavel}">
                                <button type="button" class="btn btn-sm btn-outline-success mb-1"
                                        th:attr="data-id=${pedido.id}" onclick="aplicarDesconto(this)">Desconto</button>
                                <button type="button" class="btn btn-sm btn-outline-danger mb-1"
                                        th:attr="data-id=${pedido.id}" onclick="cancelarPedido(this)">Cancelar</button>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        // Chama a API e recarrega a página; se der erro mostra a mensagem do servidor
        async function chamarApi(url, opcoes) {
            const resposta = await fetch(url, opcoes);
            if (resposta.ok) {
                location.reload();
                return;
            }
            let mensagem = 'Operação não permitida (código ' + resposta.status + ').';
            try {
                const json = await resposta.json();
                if (json.erro) {
                    mensagem = json.erro;
                }
            } catch (e) { /* resposta sem JSON (ex.: 403) */ }
            const alerta = document.getElementById('alerta-erro');
            alerta.textContent = mensagem;
            alerta.style.display = 'block';
        }

        function mudarStatus(botao) {
            const id = botao.dataset.id;
            const status = botao.dataset.status;
            chamarApi('/api/pedidos/' + id + '/status?status=' + status, { method: 'PUT' });
        }

        function cancelarPedido(botao) {
            const justificativa = prompt('Informe a justificativa do cancelamento:');
            if (justificativa === null) {
                return;
            }
            chamarApi('/api/pedidos/' + botao.dataset.id + '/cancelar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ justificativa: justificativa })
            });
        }

        function aplicarDesconto(botao) {
            const texto = prompt('Percentual de desconto (máximo 20):');
            if (texto === null) {
                return;
            }
            chamarApi('/api/pedidos/' + botao.dataset.id + '/desconto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ percentual: parseFloat(texto.replace(',', '.')) })
            });
        }
    </script>
</div>

</body>
</html>
